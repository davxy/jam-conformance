# L0 -- Smoke test (tiny spec)
#
# Minimal sanity run: 100 steps, empty workload, no mutations, no Safrole.

source = "local"
jam_spec = "tiny"
max_steps = 100
profile = "empty"
max_work_items = 0
max_mutations = 0
remote_timeout = 15
log_file = "fuzz.log"
pvm_interpreter_backend = true

# If required, overwrite via `--target-sock` CLI option
target_sock = "/tmp/jam_fuzz/fuzz.sock"

# Shared
step_period = 0
verbosity = 2
trace_dir = "traces"
safrole = false
skip_slots = false
single_step = false
pause_on_error = false
trace_traces = false
